<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Address Information - Green Global Funds</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .brand-green { color: #007A33; }
        .bg-brand-green { background-color: #007A33; }
        .bg-brand-dark-green { background-color: #004B23; }
        .border-brand-green { border-color: #007A33; }
        input:focus, select:focus { border-color: #007A33; box-shadow: 0 0 0 3px rgba(0, 122, 51, 0.15); }
    </style>
</head>
<body class="bg-gray-50 font-sans text-gray-800 antialiased min-h-screen flex flex-col">

    <header class="bg-white border-b border-gray-100">
        <div class="max-w-7xl mx-auto px-6 py-4 flex items-center justify-between">
            <a href="index.html" class="flex items-center space-x-2">
                <div class="w-8 h-8 rounded-full bg-brand-green flex items-center justify-center text-white">
                    <i class="fas fa-globe"></i>
                </div>
                <div class="leading-tight">
                    <span class="font-bold text-sm tracking-wide block uppercase" data-i18n="siteName">Green Global</span>
                    <span class="text-xs tracking-widest block text-gray-500 uppercase -mt-1" data-i18n="siteSuffix">Funds</span>
                </div>
            </a>

            <nav class="hidden md:flex space-x-8 text-sm font-medium text-gray-600">
                <a href="index.html" class="hover:text-brand-green transition" data-i18n="navHome">Home</a>
                <a href="#" class="hover:text-brand-green transition" data-i18n="navAbout">About Us</a>
                <a href="#" class="hover:text-brand-green transition" data-i18n="navServices">Services</a>
                <a href="#" class="hover:text-brand-green transition" data-i18n="navHow">How It Works</a>
                <a href="#" class="hover:text-brand-green transition" data-i18n="navContact">Contact</a>
            </nav>

            <div class="flex items-center space-x-3">
                <button onclick="showLanguageOverlay()" class="flex items-center space-x-1.5 border border-gray-200 rounded-lg px-3 py-2 text-xs hover:bg-gray-50 transition" title="Change Country / Language">
                    <span id="current-flag">🇺🇸</span>
                    <span id="current-country-name" class="hidden sm:inline text-gray-600 font-medium">United States</span>
                    <i class="fas fa-chevron-down text-[10px] text-gray-400"></i>
                </button>
                <a href="signin.html" class="border border-brand-green brand-green px-5 py-2 rounded-lg text-sm font-medium hover:bg-green-50 transition" data-i18n="signIn">Sign In</a>
                <a href="signup.html" class="bg-brand-green text-white px-5 py-2 rounded-lg text-sm font-medium hover:bg-emerald-800 transition" data-i18n="signUp">Sign Up</a>
            </div>
        </div>
    </header>

    <main class="flex-grow py-10 px-4">
        <div class="max-w-3xl mx-auto bg-white rounded-2xl shadow-sm border border-gray-100 p-8">
            <div class="flex items-center gap-3 mb-8 pb-4 border-b border-gray-100">
                <div class="w-8 h-8 bg-brand-green text-white rounded-full flex items-center justify-center text-sm font-bold">2</div>
                <h2 class="text-xl font-bold text-gray-900" data-i18n="addressInfo">Address Information</h2>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                <div class="md:col-span-3">
                    <label for="street" class="block text-sm font-semibold text-gray-600 mb-1.5" data-i18n="streetLabel">Street & House Number</label>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 flex items-center pl-3.5 text-brand-green"><i class="fas fa-home text-sm"></i></span>
                        <input type="text" id="street" data-i18n-placeholder="streetPlaceholder" placeholder="Enter street and house number" class="w-full pl-10 pr-4 py-2.5 border border-gray-200 rounded-lg text-sm focus:outline-none transition bg-white">
                    </div>
                </div>

                <div>
                    <label for="postal-code" class="block text-sm font-semibold text-gray-600 mb-1.5" data-i18n="postalLabel">Postal Code</label>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 flex items-center pl-3.5 text-brand-green"><i class="fas fa-mailbox text-sm"></i></span>
                        <input type="text" id="postal-code" data-i18n-placeholder="postalPlaceholder" placeholder="Enter postal code" class="w-full pl-10 pr-4 py-2.5 border border-gray-200 rounded-lg text-sm focus:outline-none transition bg-white">
                    </div>
                </div>

                <div>
                    <label for="city" class="block text-sm font-semibold text-gray-600 mb-1.5" data-i18n="cityLabel">City</label>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 flex items-center pl-3.5 text-brand-green"><i class="fas fa-city text-sm"></i></span>
                        <input type="text" id="city" data-i18n-placeholder="cityPlaceholder" placeholder="Enter your city" class="w-full pl-10 pr-4 py-2.5 border border-gray-200 rounded-lg text-sm focus:outline-none transition bg-white">
                    </div>
                </div>

                <div>
                    <label for="state" class="block text-sm font-semibold text-gray-600 mb-1.5" data-i18n="stateLabel">State / Region</label>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 flex items-center pl-3.5 text-brand-green pointer-events-none"><i class="fas fa-map text-sm"></i></span>
                        <select id="state" disabled class="w-full pl-10 pr-10 py-2.5 border border-gray-200 rounded-lg text-sm focus:outline-none transition bg-white appearance-none cursor-pointer disabled:opacity-50 disabled:cursor-not-allowed">
                            <option value="" disabled selected data-i18n="selectState">Select state</option>
                        </select>
                        <span class="absolute inset-y-0 right-0 flex items-center pr-3 text-gray-400 pointer-events-none"><i class="fas fa-chevron-down text-xs"></i></span>
                    </div>
                </div>

                <div class="md:col-span-3">
                    <label for="country" class="block text-sm font-semibold text-gray-600 mb-1.5" data-i18n="countryLabel">Country</label>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 flex items-center pl-3.5 text-brand-green pointer-events-none"><i class="fas fa-globe text-sm"></i></span>
                        <select id="country" onchange="populateStates()" class="w-full pl-10 pr-10 py-2.5 border border-gray-200 rounded-lg text-sm focus:outline-none transition bg-white appearance-none cursor-pointer">
                        </select>
                        <span class="absolute inset-y-0 right-0 flex items-center pr-3 text-gray-400 pointer-events-none"><i class="fas fa-chevron-down text-xs"></i></span>
                    </div>
                </div>
            </div>

            <div class="mt-8 pt-6 border-t border-gray-100 flex justify-between items-center">
                <a href="signup.html" class="text-sm text-gray-500 hover:text-brand-green transition flex items-center gap-1">
                    <i class="fas fa-arrow-left text-xs"></i> <span data-i18n="back">Back</span>
                </a>
                <button type="button" onclick="handleAddressContinue()" class="bg-brand-green text-white px-8 py-2.5 rounded-lg text-sm font-medium hover:bg-emerald-800 transition shadow-sm" data-i18n="continueBtn">
                    Continue
                </button>
            </div>
        </div>
    </main>

    <footer class="bg-brand-dark-green text-white py-8 mt-auto">
        <div class="max-w-7xl mx-auto px-6 text-center text-sm text-emerald-200">
            <p data-i18n="footerRights">&copy; 2026 Green Global Funds. All rights reserved.</p>
        </div>
    </footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.0/dist/umd/supabase.min.js"></script>
<script src="supabase-config.js"></script>
<script src="supabase.js?v=3"></script>
<script src="languages.js"></script>
<script>
const STATES = {
  us: ["Alabama","Alaska","Arizona","Arkansas","California","Colorado","Connecticut","Delaware","Florida","Georgia","Hawaii","Idaho","Illinois","Indiana","Iowa","Kansas","Kentucky","Louisiana","Maine","Maryland","Massachusetts","Michigan","Minnesota","Mississippi","Missouri","Montana","Nebraska","Nevada","New Hampshire","New Jersey","New Mexico","New York","North Carolina","North Dakota","Ohio","Oklahoma","Oregon","Pennsylvania","Rhode Island","South Carolina","South Dakota","Tennessee","Texas","Utah","Vermont","Virginia","Washington","West Virginia","Wisconsin","Wyoming"],
  gb: ["England","Scotland","Wales","Northern Ireland"],
  de: ["Baden-Württemberg","Bavaria","Berlin","Brandenburg","Bremen","Hamburg","Hesse","Lower Saxony","Mecklenburg-Vorpommern","North Rhine-Westphalia","Rhineland-Palatinate","Saarland","Saxony","Saxony-Anhalt","Schleswig-Holstein","Thuringia"],
  fr: ["Auvergne-Rhône-Alpes","Brittany","Bourgogne-Franche-Comté","Centre-Val de Loire","Corsica","Grand Est","Hauts-de-France","Île-de-France","Normandy","Nouvelle-Aquitaine","Occitanie","Pays de la Loire","Provence-Alpes-Côte d'Azur"],
  es: ["Andalusia","Aragon","Asturias","Balearic Islands","Basque Country","Canary Islands","Cantabria","Castile and León","Castilla-La Mancha","Catalonia","Extremadura","Galicia","La Rioja","Madrid","Murcia","Navarre","Valencia"],
  it: ["Abruzzo","Apulia","Basilicata","Calabria","Campania","Emilia-Romagna","Friuli-Venezia Giulia","Lazio","Liguria","Lombardy","Marche","Molise","Piedmont","Sardinia","Sicily","Trentino-Alto Adige","Tuscany","Umbria","Veneto"],
  ng: ["Abia","Abuja FCT","Adamawa","Akwa Ibom","Anambra","Bauchi","Bayelsa","Benue","Borno","Cross River","Delta","Ebonyi","Edo","Ekiti","Enugu","Gombe","Imo","Jigawa","Kaduna","Kano","Katsina","Kebbi","Kogi","Kwara","Lagos","Nasarawa","Niger","Ogun","Ondo","Osun","Oyo","Plateau","Rivers","Sokoto","Taraba","Yobe","Zamfara"],
  br: ["Acre","Alagoas","Amapá","Amazonas","Bahia","Ceará","Distrito Federal","Espírito Santo","Goiás","Maranhão","Mato Grosso","Mato Grosso do Sul","Minas Gerais","Pará","Paraíba","Paraná","Pernambuco","Piauí","Rio de Janeiro","Rio Grande do Norte","Rio Grande do Sul","Rondônia","Roraima","Santa Catarina","São Paulo","Sergipe","Tocantins"]
};

document.addEventListener("DOMContentLoaded", async function() {
  const user = await initAuth();
  if (!user) { window.location.href = "signin.html"; return; }
  buildCountryOverlay();
  initLanguageSelector();
  populateCountries();
});

function populateCountries() {
  const countrySel = document.getElementById("country");
  countrySel.innerHTML = '<option value="" disabled selected>Select country</option>';
  COUNTRIES.forEach(c => {
    const opt = document.createElement("option");
    opt.value = c.code;
    opt.textContent = c.flag + " " + c.name;
    countrySel.appendChild(opt);
  });
}

function populateStates() {
  const countryCode = document.getElementById("country").value;
  const stateSel = document.getElementById("state");
  stateSel.innerHTML = '<option value="" disabled selected>Select state</option>';
  if (countryCode && STATES[countryCode]) {
    STATES[countryCode].forEach(s => {
      const opt = document.createElement("option");
      opt.value = s;
      opt.textContent = s;
      stateSel.appendChild(opt);
    });
  }
  stateSel.disabled = !countryCode;
}

async function handleAddressContinue() {
  const street = document.getElementById("street");
  const postal = document.getElementById("postal-code");
  const city = document.getElementById("city");
  const state = document.getElementById("state");
  const country = document.getElementById("country");

  if (!street.value.trim() || !postal.value.trim() || !city.value.trim()) {
    alert("Please fill in all address fields.");
    return;
  }
  if (!country.value) {
    alert("Please select your country.");
    return;
  }
  if (!state.value) {
    alert("Please select your state.");
    return;
  }
  try {
    await updateProfile({
      street: street.value.trim(),
      postal_code: postal.value.trim(),
      city: city.value.trim(),
      state: state.value,
      country: country.value
    });
    window.location.href = "card.html";
  } catch (err) {
    alert(err.message || "Failed to save address.");
  }
}
</script>
</body>
</html>
