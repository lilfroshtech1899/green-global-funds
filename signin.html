<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In - Green Global Funds</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .brand-green { color: #007A33; }
        .bg-brand-green { background-color: #007A33; }
        .bg-brand-dark-green { background-color: #004B23; }
    </style>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center p-4">

    <div class="bg-white rounded-3xl shadow-xl w-full max-w-4xl overflow-hidden grid grid-cols-1 md:grid-cols-12 min-h-[580px]">
        
        <div class="md:col-span-5 bg-brand-dark-green p-10 text-white flex flex-col justify-between relative overflow-hidden">
            <div class="absolute inset-0 opacity-10 pointer-events-none">
                <svg width="100%" height="100%"><path d="M0 100 Q 100 300 300 100 T 600 300" fill="none" stroke="white" stroke-width="2"/></svg>
            </div>
            
            <a href="index.html" class="flex items-center space-x-2 z-10">
                <div class="w-7 h-7 rounded-full bg-white text-emerald-900 flex items-center justify-center text-sm">
                    <i class="fas fa-globe"></i>
                </div>
                <div class="leading-tight text-xs tracking-wide font-bold uppercase">
                    <span class="block" data-i18n="siteName">Green Global</span> <span class="block text-[10px] font-normal tracking-widest text-emerald-300 opacity-80 -mt-0.5" data-i18n="siteSuffix">Funds</span>
                </div>
            </a>

            <div class="my-auto py-8 z-10">
                <h2 class="text-3xl font-bold mb-4" data-i18n="welcomeBack">Welcome Back!</h2>
                <p class="text-emerald-100 text-sm opacity-90 leading-relaxed" data-i18n="signInDesc">
                    Sign in to your account and continue your financial journey with confidence.
                </p>
            </div>

            <div class="space-y-3 text-xs text-emerald-100 font-medium z-10">
                <div class="flex items-center space-x-2">
                    <i class="fas fa-check-circle text-emerald-400"></i> <span data-i18n="secureLogin">Secure Login</span>
                </div>
                <div class="flex items-center space-x-2">
                    <i class="fas fa-check-circle text-emerald-400"></i> <span data-i18n="fastAccess">Fast & Easy Access</span>
                </div>
                <div class="flex items-center space-x-2">
                    <i class="fas fa-check-circle text-emerald-400"></i> <span data-i18n="manageAccount">Manage Your Account</span>
                </div>
            </div>
        </div>

        <div class="md:col-span-7 p-10 flex flex-col justify-center relative">
            <div class="absolute top-4 right-4">
                <button onclick="showLanguageOverlay()" class="flex items-center space-x-1.5 border border-gray-200 rounded-lg px-3 py-1.5 text-xs hover:bg-gray-50 transition" title="Change Country / Language">
                    <span id="current-flag">🇺🇸</span>
                    <span id="current-country-name" class="hidden sm:inline text-gray-600 font-medium">United States</span>
                    <i class="fas fa-chevron-down text-[10px] text-gray-400"></i>
                </button>
            </div>
            <a href="index.html" class="text-gray-600 hover:text-brand-green transition text-sm flex items-center gap-2 mb-4 border border-gray-200 rounded-lg px-3 py-1.5 w-fit hover:bg-gray-50">
                <i class="fas fa-arrow-left text-xs"></i> <span data-i18n="backToHome">Back to Home</span>
            </a>
            <div class="mb-8">
                <h3 class="text-2xl font-bold text-gray-900" data-i18n="signInTitle">Sign In</h3>
                <p class="text-gray-400 text-xs mt-1" data-i18n="signInSub">Enter your details to access your account</p>
            </div>

            <form class="space-y-4">
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-4 text-gray-400 text-sm">
                        <i class="far fa-envelope"></i>
                    </span>
                    <input type="email" data-i18n-placeholder="email" placeholder="Email Address" class="w-full pl-11 pr-4 py-3 bg-white border border-gray-200 rounded-xl text-sm focus:outline-none focus:border-emerald-600 transition">
                </div>

                <div class="relative">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-4 text-gray-400 text-sm">
                        <i class="fas fa-lock"></i>
                    </span>
                    <input type="password" data-i18n-placeholder="password" placeholder="Password" class="w-full pl-11 pr-11 py-3 bg-white border border-gray-200 rounded-xl text-sm focus:outline-none focus:border-emerald-600 transition">
                    <span class="absolute inset-y-0 right-0 flex items-center pr-4 text-gray-400 cursor-pointer hover:text-gray-600 text-xs">
                        <i class="far fa-eye-slash"></i>
                    </span>
                </div>

                <div class="flex items-center justify-between text-xs pt-1">
                    <label class="flex items-center space-x-2 text-gray-500 cursor-pointer">
                        <input type="checkbox" class="rounded border-gray-300 text-brand-green focus:ring-transparent w-4 h-4">
                        <span data-i18n="rememberMe">Remember Me</span>
                    </label>
                    <a href="#" class="text-emerald-600 hover:underline font-semibold" data-i18n="forgotPassword">Forgot Password?</a>
                </div>

                <button type="submit" class="w-full bg-brand-green text-white py-3 rounded-xl font-medium text-sm shadow-md hover:bg-emerald-800 transition mt-2" data-i18n="signInBtn">
                    Sign In
                </button>
            </form>

            <div class="relative my-6 text-center">
                <hr class="border-gray-100">
                <span class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 bg-white px-3 text-gray-400 text-xs" data-i18n="or">or</span>
            </div>

            <button class="w-full border border-gray-200 text-gray-700 py-3 rounded-xl font-medium text-sm flex items-center justify-center space-x-2 hover:bg-gray-50 transition">
                <svg class="w-4 h-4" viewBox="0 0 24 24">
                    <path fill="#EA4335" d="M12.24 10.285V14.4h6.887c-.275 1.565-1.88 4.604-6.887 4.604-4.33 0-7.866-3.577-7.866-8s3.536-8 7.866-8c2.46 0 4.105 1.025 5.047 1.926l3.227-3.107C18.29 1.137 15.538 0 12.24 0 5.58 0 0 5.37 0 12s5.58 12 12.24 12c6.96 0 11.57-4.834 11.57-11.79 0-.79-.085-1.4-.185-1.925H12.24z"/>
                </svg>
                <span data-i18n="signInGoogle">Sign in with Google</span>
            </button>

            <div class="text-center text-xs text-gray-500 mt-8">
                <span data-i18n="noAccount">Don't have an account?</span> <a href="signup.html" class="text-emerald-600 font-bold hover:underline" data-i18n="signUpLink">Sign Up</a>
            </div>
        </div>

    </div>

<script src="languages.js"></script>
<script>document.addEventListener("DOMContentLoaded", function() { buildCountryOverlay(); initLanguageSelector(); });</script>
</body>
</html>
